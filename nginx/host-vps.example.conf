# Host Nginx example for VPS (not the compose nginx service).
# Install under /etc/nginx/sites-available/mdm.pandascript.dev
# then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name mdm.pandascript.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mdm.pandascript.dev;

    ssl_certificate /etc/letsencrypt/live/mdm.pandascript.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mdm.pandascript.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Enrollment profile (direct API — avoids redirect)
    location = /enrollment.mobileconfig {
        proxy_pass http://127.0.0.1:3001/api/enrollment/mobileconfig;
        default_type application/x-apple-aspen-config;
        add_header Content-Disposition "attachment; filename=enrollment.mobileconfig";
    }

    # SCEP server (micromdm listens on /scep; use GET not HEAD for tests)
    location = /scep {
        proxy_pass http://127.0.0.1:2016/scep;
    }
    location /scep/ {
        proxy_pass http://127.0.0.1:2016/scep/;
    }

    # Backend API (includes /api/webhook for NanoMDM callbacks)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
    }

    # NanoMDM — keep /mdm prefix (do NOT strip to /)
    location /mdm {
        proxy_pass http://127.0.0.1:9000/mdm;
    }

    # Next.js dashboard
    location / {
        proxy_pass http://127.0.0.1:3000/;
    }
}
